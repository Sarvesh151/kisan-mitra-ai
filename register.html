<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Kisan Mitra AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef9f0,
                    #f8fff9
                );

            color: #183d25;
        }

        .register-container {
            width: 100%;
            max-width: 530px;
            padding: 25px;
        }

        .register-card {
            background: white;

            border-radius: 24px;

            padding: 40px;

            box-shadow:
                0 15px 45px rgba(40, 100, 55, 0.12);

            border: 1px solid #e1eee3;
        }

        .logo {
            width: 90px;
            height: 90px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 25px;

            background: #e9f8eb;

            font-size: 48px;
        }

        h1 {
            text-align: center;

            font-size: 34px;

            margin-bottom: 8px;

            color: #124c27;
        }

        .subtitle {
            text-align: center;

            color: #718078;

            font-size: 17px;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 8px;

            color: #214c2d;
        }

        input {
            width: 100%;

            padding: 15px 16px;

            border: 1px solid #cfe0d2;

            border-radius: 12px;

            font-size: 16px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #299447;

            box-shadow:
                0 0 0 3px rgba(41, 148, 71, 0.10);
        }

        .register-btn {
            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 12px;

            background: #39934d;

            color: white;

            font-size: 18px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 8px;

            transition: 0.2s;
        }

        .register-btn:hover {
            background: #2e7f40;

            transform: translateY(-1px);
        }

        .error {
            background: #fff0f0;

            border: 1px solid #f1bcbc;

            color: #b42318;

            padding: 12px 14px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .login-link {
            text-align: center;

            margin-top: 25px;

            color: #65736a;

            font-size: 16px;
        }

        .login-link a {
            color: #278a42;

            font-weight: 700;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .required {
            color: #d33;
        }

        @media (max-width: 600px) {

            .register-card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>


<body>

<div class="register-container">

    <div class="register-card">

        <div class="logo">
            🌱
        </div>

        <h1>
            Create Account
        </h1>

        <p class="subtitle">
            Join Kisan Mitra AI
        </p>


        {% if error %}

        <div class="error">
            ⚠️ {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('register') }}"
        >

            <!-- NAME -->

            <div class="form-group">

                <label>
                    Full Name
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email
                    <span class="required">*</span>
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter your phone number"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                    <span class="required">*</span>
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="register-btn"
            >
                🌱 Create Account
            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
